[package]
name = "parqview"
version = "0.1.0"
edition = "2021"
description = "Lightweight egui + DuckDB parquet explorer (Duckling-inspired, no Tauri/WebView)"
license = "MIT"

[[bin]]
name = "parqview"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
