[package]
name = "parqview"
version = "0.1.0"
edition = "2021"
description = "Lightweight egui + DuckDB parquet explorer for local data files and directories"
license = "MIT"
repository = "https://github.com/shan-alexander/parqview"
readme = "README.md"
keywords = ["parquet", "csv", "duckdb", "egui", "data-viewer"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "parqview"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
